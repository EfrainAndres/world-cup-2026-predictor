name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers used in CI
        run: pnpm --filter @world-cup-2026-predictor/web exec playwright install --with-deps chromium firefox webkit

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run type checks
        run: pnpm typecheck

      - name: Build packages and apps
        run: pnpm build

      - name: Run web E2E tests
        run: pnpm --filter @world-cup-2026-predictor/web test:e2e:ci
